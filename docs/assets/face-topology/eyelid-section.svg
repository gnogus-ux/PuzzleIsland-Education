<text x="675" y="138" font-family="Arial, sans-serif" font-size="23" fill="#2876a8">A  OUTER SKIN</text>
<text x="675" y="167" font-family="Arial, sans-serif" font-size="18" fill="#163047">Keep the silhouette and eye corners.</text>
<text x="675" y="238" font-family="Arial, sans-serif" font-size="23" fill="#187b55">B  FOLD / SUPPORT</text>
<text x="675" y="267" font-family="Arial, sans-serif" font-size="18" fill="#163047">Add rows where curvature needs them.</text>
<text x="675" y="338" font-family="Arial, sans-serif" font-size="23" fill="#c46617">C  LID MARGIN</text>
<text x="675" y="367" font-family="Arial, sans-serif" font-size="18" fill="#163047">Follow the eye; do not cut through it.</text>
<text x="675" y="423" font-family="Arial, sans-serif" font-size="23" fill="#c46617">D  INNER TURN</text>
<text x="675" y="452" font-family="Arial, sans-serif" font-size="18" fill="#163047">Build thickness / wall; do not cap the eye.</text>
<text x="675" y="540" font-family="Arial, sans-serif" font-size="20" fill="#163047">Inspect front + side + underside.</text>
<text x="675" y="574" font-family="Arial, sans-serif" font-size="18" fill="#163047">Smooth shading does not prove good geometry.</text>
</svg>