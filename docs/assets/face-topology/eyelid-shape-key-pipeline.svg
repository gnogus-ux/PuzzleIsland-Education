<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" role="img" aria-labelledby="title desc"><title id="title">Eyelid shape-key pipeline and independent control display</title><desc id="desc">Original conceptual diagram. Stable Basis and blink geometry are separated from region masks, shape keys, bone inputs, drivers and custom display meshes. No executable rig or measured Lumi configuration is implied.</desc><rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="35" y="49" font-family="Arial, sans-serif" font-size="29" fill="#193447">EYELIDS: GEOMETRY, WEIGHTS, INPUT AND DISPLAY ARE SEPARATE</text>
<text x="35" y="86" font-family="Arial, sans-serif" font-size="20" fill="#193447">Original conceptual pipeline - not tutorial tracing, a fixed rig or a ready-to-run Blender Guide</text>
<text x="40" y="154" font-family="Arial, sans-serif" font-size="24" fill="#193447">A  AUTHOR THE SHAPES</text>
<rect x="40" y="185" width="300" height="140" rx="12" fill="#ffffff" stroke="#246eaa" stroke-width="3"/>
<text x="55" y="224" font-family="Arial, sans-serif" font-size="24" fill="#246eaa">Basis + blink source</text>
<text x="55" y="261" font-family="Arial, sans-serif" font-size="19" fill="#193447">Stable vertex correspondence</text>
<text x="55" y="288" font-family="Arial, sans-serif" font-size="19" fill="#193447">Preserve neutral geometry</text>
<rect x="400" y="185" width="300" height="140" rx="12" fill="#ffffff" stroke="#187f60" stroke-width="3"/>
<text x="415" y="224" font-family="Arial, sans-serif" font-size="24" fill="#187f60">4 region groups</text>
<text x="415" y="261" font-family="Arial, sans-serif" font-size="19" fill="#193447">Left / right, upper / lower</text>
<text x="415" y="288" font-family="Arial, sans-serif" font-size="19" fill="#193447">Check assignment + overlap</text>
<rect x="760" y="185" width="300" height="140" rx="12" fill="#ffffff" stroke="#187f60" stroke-width="3"/>
<text x="775" y="224" font-family="Arial, sans-serif" font-size="24" fill="#187f60">4 relative keys</text>
<text x="775" y="261" font-family="Arial, sans-serif" font-size="19" fill="#193447">Copy the intended shape</text>
<text x="775" y="288" font-family="Arial, sans-serif" font-size="19" fill="#193447">Map each region explicitly</text>
<rect x="1120" y="185" width="330" height="140" rx="12" fill="#ffffff" stroke="#246eaa" stroke-width="3"/>
<text x="1135" y="224" font-family="Arial, sans-serif" font-size="24" fill="#246eaa">Shape-only tests</text>
<text x="1135" y="261" font-family="Arial, sans-serif" font-size="19" fill="#193447">Neutral / intermediate / close</text>
<text x="1135" y="288" font-family="Arial, sans-serif" font-size="19" fill="#193447">Contact is checked separately</text>
<polyline points="340,255 400,255" fill="none" stroke="#667f93" stroke-width="3"/>
<polyline points="388,248 400,255 388,262" fill="none" stroke="#667f93" stroke-width="3"/>
