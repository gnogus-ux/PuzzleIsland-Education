<text x="975" y="462" font-family="Arial, sans-serif" font-size="22" fill="#bd6219">C</text>
<text x="835" y="578" font-family="Arial, sans-serif" font-size="21" fill="#193447">Gap / thickness are not to scale.</text>
<text x="835" y="620" font-family="Arial, sans-serif" font-size="21" fill="#193447">Check the real eye and intended wall end.</text>
<text x="43" y="709" font-family="Arial, sans-serif" font-size="23" fill="#246eaa">A  OUTER SKIN</text>
<text x="43" y="736" font-family="Arial, sans-serif" font-size="20" fill="#193447">Connect to forehead, nose and cheek.</text>
<text x="43" y="776" font-family="Arial, sans-serif" font-size="23" fill="#187f60">B  SUPPORT / FOLD</text>
<text x="43" y="803" font-family="Arial, sans-serif" font-size="20" fill="#193447">Space rows for curvature; avoid corner crowding.</text>
<text x="43" y="843" font-family="Arial, sans-serif" font-size="23" fill="#bd6219">C  OPENING RIM</text>
<text x="43" y="870" font-family="Arial, sans-serif" font-size="20" fill="#193447">Keep upper/lower outline and both corners.</text>
<text x="43" y="910" font-family="Arial, sans-serif" font-size="23" fill="#8050a5">D  INNER TURN</text>
<text x="43" y="937" font-family="Arial, sans-serif" font-size="20" fill="#193447">Follow the eye; document the end boundary.</text>
<text x="798" y="706" font-family="Arial, sans-serif" font-size="20" fill="#193447">Inspect front, oblique, side, underside and inside.</text>
<text x="798" y="757" font-family="Arial, sans-serif" font-size="20" fill="#193447">Compare with the eye shown and temporarily hidden.</text>
<text x="798" y="808" font-family="Arial, sans-serif" font-size="20" fill="#193447">Check normals, overlap and intended open borders.</text>
<text x="798" y="859" font-family="Arial, sans-serif" font-size="20" fill="#193447">A wall end can be open by design; a skin join needs weld.</text>
<text x="798" y="910" font-family="Arial, sans-serif" font-size="20" fill="#193447">Support geometry alone does not certify a good blink.</text>
<text x="798" y="967" font-family="Arial, sans-serif" font-size="19" fill="#193447">Basic shape work and later deformation tests are separate.</text>
