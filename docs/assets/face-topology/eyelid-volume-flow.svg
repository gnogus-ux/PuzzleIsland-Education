<text x="223" y="527" font-family="Arial, sans-serif" font-size="21" fill="#193447">Leave the center uncapped.</text>
<text x="65" y="589" font-family="Arial, sans-serif" font-size="21" fill="#b04460">M / L: preserve both corner landmarks.</text>
<text x="65" y="626" font-family="Arial, sans-serif" font-size="20" fill="#193447">Upper and lower rows meet locally at each corner.</text>
