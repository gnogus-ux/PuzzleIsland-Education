<text x="958" y="386" font-family="Arial, sans-serif" font-size="25" fill="#247f67">Future movement plan - NOT EXECUTED</text>
<text x="958" y="426" font-family="Arial, sans-serif" font-size="21" fill="#193447">Upper assembly: head-side responsibility.</text>
<text x="958" y="454" font-family="Arial, sans-serif" font-size="21" fill="#193447">Lower assembly: jaw-side responsibility.</text>
<text x="958" y="482" font-family="Arial, sans-serif" font-size="21" fill="#193447">Tongue: base motion and own deformation differ.</text>
<rect x="940" y="535" width="715" height="170" rx="12" fill="white" stroke="#a9587c" stroke-width="3"/>
<text x="958" y="576" font-family="Arial, sans-serif" font-size="25" fill="#a9587c">Visibility is not a structural PASS</text>
<text x="958" y="616" font-family="Arial, sans-serif" font-size="21" fill="#193447">Check walls, normals, gaps and intersections.</text>
<text x="958" y="644" font-family="Arial, sans-serif" font-size="21" fill="#193447">Use front, oblique, side and internal views.</text>
<text x="958" y="672" font-family="Arial, sans-serif" font-size="21" fill="#193447">A closed-looking mouth does not prove motion quality.</text>
<text x="40" y="779" font-family="Arial, sans-serif" font-size="24" fill="#193447">C  PROPOSED BUILD / REVIEW ORDER - ALL LUMI MODEL OPERATIONS NOT RUN</text>
