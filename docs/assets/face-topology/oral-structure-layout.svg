<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1100" viewBox="0 0 1700 1100" role="img" aria-labelledby="title desc"><title id="title">Simplified cartoon mouth structure and assembly responsibilities</title><desc id="desc">Original conceptual side section. An open lip entrance leads into an inner mouth wall. Upper and lower teeth and gums and a separate tongue occupy the cavity. Rear termination requires design and verification. Future movement responsibilities are proposals only; no Lumi model, rig or anatomy accuracy is implied.</desc><rect width="100%" height="100%" fill="#f6f8fc"/>
