<text x="828" y="385" font-family="Arial, sans-serif" font-size="25" fill="#ae425a">J</text>
<text x="40" y="563" font-family="Arial, sans-serif" font-size="21" fill="#193447">The reference can hide missing patches.</text>
<text x="40" y="597" font-family="Arial, sans-serif" font-size="20" fill="#193447">Surface fit does not prove target coverage.</text>
<text x="525" y="563" font-family="Arial, sans-serif" font-size="21" fill="#193447">Inspect actual faces and remaining borders.</text>
<text x="525" y="597" font-family="Arial, sans-serif" font-size="20" fill="#193447">A visible seam does not prove a weld.</text>
<text x="1000" y="228" font-family="Arial, sans-serif" font-size="24" fill="#246eaa">F  FEATURE OPENING</text>
<text x="1000" y="259" font-family="Arial, sans-serif" font-size="19" fill="#193447">Eye / lip opening: keep the intended hole.</text>
<text x="1000" y="313" font-family="Arial, sans-serif" font-size="24" fill="#bd6219">G  CONSTRUCTION GAP</text>
<text x="1000" y="344" font-family="Arial, sans-serif" font-size="19" fill="#193447">Unfinished region: plan the next patch.</text>
<text x="1000" y="398" font-family="Arial, sans-serif" font-size="24" fill="#ae425a">J  SKIN JOIN</text>
<text x="1000" y="429" font-family="Arial, sans-serif" font-size="19" fill="#193447">Count and match the shared boundary.</text>
<text x="1000" y="483" font-family="Arial, sans-serif" font-size="24" fill="#8050a5">I  INNER WALL END</text>
<text x="1000" y="514" font-family="Arial, sans-serif" font-size="19" fill="#193447">Document whether an open end is intended.</text>
<polyline points="35.0,642.0 1465.0,642.0" fill="none" stroke="#b7c4cd" stroke-width="2"/>
<text x="40" y="696" font-family="Arial, sans-serif" font-size="24" fill="#193447">MATCH THE COMPARISON STATE</text>
<text x="40" y="740" font-family="Arial, sans-serif" font-size="22" fill="#193447">Object / copy name  |  shape key + values  |  timeline frame  |  view / camera</text>
<text x="40" y="782" font-family="Arial, sans-serif" font-size="22" fill="#193447">Source visibility  |  base cage or evaluated surface  |  modifier order + display state</text>
<text x="40" y="835" font-family="Arial, sans-serif" font-size="20" fill="#193447">A good preview is evidence for that state only. Confirm topology and contact separately.</text>
</svg>
