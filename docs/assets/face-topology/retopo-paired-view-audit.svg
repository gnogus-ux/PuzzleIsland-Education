<text x="35" y="85" font-family="Arial, sans-serif" font-size="20" fill="#193447">Original schematic - not a measured mesh, tutorial tracing or executable Blender Guide</text>
<text x="40" y="150" font-family="Arial, sans-serif" font-size="25" fill="#193447">A  SOURCE + TARGET</text>
<text x="525" y="150" font-family="Arial, sans-serif" font-size="25" fill="#193447">B  TARGET ONLY</text>
<text x="1000" y="150" font-family="Arial, sans-serif" font-size="25" fill="#193447">C  CLASSIFY THE BORDER</text>
