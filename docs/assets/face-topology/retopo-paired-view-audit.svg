<text x="232" y="235" font-family="Arial, sans-serif" font-size="24" fill="#bd6219">G</text>
<text x="692" y="235" font-family="Arial, sans-serif" font-size="24" fill="#bd6219">G</text>
<text x="610" y="302" font-family="Arial, sans-serif" font-size="22" fill="#246eaa">F</text>
<text x="709" y="436" font-family="Arial, sans-serif" font-size="22" fill="#246eaa">F</text>
