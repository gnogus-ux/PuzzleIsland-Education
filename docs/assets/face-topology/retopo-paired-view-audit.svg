<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc"><title id="title">Retopology coverage audit with separate views</title><desc id="desc">Original conceptual diagram. Reference visibility can hide missing target patches. Distinguish feature openings, construction gaps, skin joins and intentional wall ends. Not a tutorial tracing, measured Lumi mesh or executable guide.</desc><rect width="100%" height="100%" fill="#f7f9fc"/>
