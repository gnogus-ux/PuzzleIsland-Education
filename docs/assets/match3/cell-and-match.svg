<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc"><title id="title">셀 상태와 매치 그룹 구별</title><desc id="desc">셀 존재와 조각 점유, 직선 매치와 연결 덩어리의 차이를 설명하는 자체 교육 도식이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#96add0"/></marker></defs><rect width="100%" height="100%" fill="#101a2b"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif" fill="#eaf2ff"><text x="40" y="48" font-size="28" fill="#eaf2ff">셀의 존재 · 조각 점유 · 제거 규칙을 나눠 생각한다</text><rect x="40" y="95" width="250" height="100" rx="14" fill="#2a3042" stroke="#577ca4"/><text x="58" y="129" font-size="22" fill="#eaf2ff">마스크 구멍</text><text x="58" y="158" font-size="16" fill="#c0d3eb">비활성 · 생성/난수 소비 없음</text><rect x="320" y="95" width="250" height="100" rx="14" fill="#1e4557" stroke="#577ca4"/><text x="338" y="129" font-size="22" fill="#eaf2ff">제거 뒤 빈칸</text><text x="338" y="158" font-size="16" fill="#c0d3eb">활성 · 해결 중 보충 대상</text><rect x="600" y="95" width="250" height="100" rx="14" fill="#634b2b" stroke="#577ca4"/><text x="618" y="129" font-size="22" fill="#eaf2ff">잠금 바닥</text><text x="618" y="158" font-size="16" fill="#c0d3eb">조각 있음 · 교환 제약</text><rect x="880" y="95" width="250" height="100" rx="14" fill="#4c4467" stroke="#577ca4"/><text x="898" y="129" font-size="22" fill="#eaf2ff">고체 장애물</text><text x="898" y="158" font-size="16" fill="#c0d3eb">점유/구간 경계 정책 별도</text><text x="40" y="254" font-size="22" fill="#eaf2ff">직선 매치: run과 고유 제거 집합은 다르다</text><rect x="40" y="285" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="102" y="285" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="164" y="285" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="226" y="285" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="288" y="285" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="40" y="347" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="102" y="347" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="164" y="347" width="54" height="54" rx="8" fill="#e0ab4e" stroke="#627b9b"/><text x="183" y="382" font-size="24" fill="#152136">A</text><rect x="226" y="347" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="288" y="347" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="40" y="409" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="102" y="409" width="54" height="54" rx="8" fill="#e0ab4e" stroke="#627b9b"/><text x="121" y="444" font-size="24" fill="#152136">A</text><rect x="164" y="409" width="54" height="54" rx="8" fill="#e0ab4e" stroke="#627b9b"/><text x="183" y="444" font-size="24" fill="#152136">A</text><rect x="226" y="409" width="54" height="54" rx="8" fill="#e0ab4e" stroke="#627b9b"/><text x="245" y="444" font-size="24" fill="#152136">A</text><rect x="288" y="409" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="40" y="471" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="102" y="471" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="164" y="471" width="54" height="54" rx="8" fill="#e0ab4e" stroke="#627b9b"/><text x="183" y="506" font-size="24" fill="#152136">A</text><rect x="226" y="471" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="288" y="471" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="40" y="533" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="102" y="533" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="164" y="533" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="226" y="533" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><rect x="288" y="533" width="54" height="54" rx="8" fill="#23364f" stroke="#627b9b"/><text x="382" y="326" font-size="23" fill="#eaf2ff">가로3 + 세로3</text><text x="382" y="363" font-size="19" fill="#c0d3eb">검출 run 2개 · 고유 제거는 5칸</text><text x="382" y="400" font-size="18" fill="#edc77a">점수·특수 생성은 별도 정책으로 결정</text><text x="755" y="254" font-size="22" fill="#eaf2ff">작은 ㄱ자 3칸</text><rect x="770" y="295" width="62" height="62" rx="8" fill="#74bdc1"/><text x="792" y="335" font-size="25" fill="#152136">B</text><rect x="842" y="295" width="62" height="62" rx="8" fill="#74bdc1"/><text x="864" y="335" font-size="25" fill="#152136">B</text><rect x="770" y="367" width="62" height="62" rx="8" fill="#74bdc1"/><text x="792" y="407" font-size="25" fill="#152136">B</text><text x="755" y="486" font-size="19" fill="#eaf2ff">직선3 규칙 → 매치 없음</text><text x="755" y="522" font-size="19" fill="#74bdc1">연결 덩어리3 규칙 → 제거</text><text x="40" y="650" font-size="18" fill="#c0d3eb">같은 색의 총수만 세면 떨어진 그룹을 섞는다. run → 연결 그룹 → 고유 제거를 구분한다.</text><text x="40" y="704" font-size="17" fill="#a9c0dd">교육 도식 · 예제 모양/색은 승인 게임 아트가 아님</text></g></svg>