<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="780" viewBox="0 0 1160 780" role="img" aria-labelledby="title desc"><title id="title">한 턴의 판정과 화면 완료</title><desc id="desc">입력 수락 뒤 한 해결 루프가 연쇄를 안정화하고 화면 완료를 기다리는 교육 도식이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#96add0"/></marker></defs><rect width="100%" height="100%" fill="#101a2b"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif" fill="#eaf2ff"><text x="40" y="48" font-size="28" fill="#eaf2ff">한 턴: 판정 결과를 확정하고 화면 완료를 기다린다</text><text x="40" y="79" font-size="17" fill="#a9c0dd">개념 도식 · 게임 코드 변경/실행 결과가 아님</text><rect x="40" y="115" width="310" height="90" rx="14" fill="#203751" stroke="#577ca4"/><text x="58" y="149" font-size="22" fill="#eaf2ff">1  입력·합법성</text><text x="58" y="178" font-size="16" fill="#c0d3eb">UI / Busy / 경계 / 잠금 / 인접성</text><rect x="425" y="115" width="310" height="90" rx="14" fill="#203751" stroke="#577ca4"/><text x="443" y="149" font-size="22" fill="#eaf2ff">2  교환 결과 시험</text><text x="443" y="178" font-size="16" fill="#c0d3eb">무효면 원복 · 난수/이동 수 보존</text><rect x="810" y="115" width="310" height="90" rx="14" fill="#203751" stroke="#577ca4"/><text x="828" y="149" font-size="22" fill="#eaf2ff">3  검출·계획</text><text x="828" y="178" font-size="16" fill="#c0d3eb">run / 그룹 / 생성·보존 / 효과 큐</text><path d="M350,160 L425,160" stroke="#96add0" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M735,160 L810,160" stroke="#96add0" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="810" y="295" width="310" height="90" rx="14" fill="#203751" stroke="#577ca4"/><text x="828" y="329" font-size="22" fill="#eaf2ff">4  실제 제거·피해</text><text x="828" y="358" font-size="16" fill="#c0d3eb">고유 ID / 이벤트 가드 / 목표·점수</text><rect x="425" y="295" width="310" height="90" rx="14" fill="#203751" stroke="#577ca4"/><text x="443" y="329" font-size="22" fill="#eaf2ff">5  구간 압축·보충</text><text x="443" y="358" font-size="16" fill="#c0d3eb">생존 순서 / 생성점 / PRNG 순서</text><rect x="40" y="295" width="310" height="90" rx="14" fill="#203751" stroke="#577ca4"/><text x="58" y="329" font-size="22" fill="#eaf2ff">6  새 매치 검사</text><text x="58" y="358" font-size="16" fill="#c0d3eb">있으면 같은 해결 루프에서 반복</text><path d="M965,205 L965,295" stroke="#96add0" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M810,340 L735,340" stroke="#96add0" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M425,340 L350,340" stroke="#96add0" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M195,295 L195,247 L965,247 L965,205" fill="none" stroke="#edc77a" stroke-width="3" marker-end="url(#arrow)"/><text x="460" y="236" font-size="16" fill="#edc77a">연쇄가 있으면 3번으로</text><rect x="40" y="490" width="310" height="90" rx="14" fill="#203751" stroke="#577ca4"/><text x="58" y="524" font-size="22" fill="#eaf2ff">7  안정판 판정</text><text x="58" y="553" font-size="16" fill="#c0d3eb">목표 / 남은 수 / 가능한 명령</text><rect x="425" y="490" width="310" height="90" rx="14" fill="#203751" stroke="#577ca4"/><text x="443" y="524" font-size="22" fill="#eaf2ff">8  화면 재생 완료</text><text x="443" y="553" font-size="16" fill="#c0d3eb">제거·비행·낙하·카운터 따라잡기</text><rect x="810" y="490" width="310" height="90" rx="14" fill="#203751" stroke="#577ca4"/><text x="828" y="524" font-size="22" fill="#eaf2ff">9  세션 전환·저장</text><text x="828" y="553" font-size="16" fill="#c0d3eb">입력 해제 또는 결과 · 고유 보상 거래</text><path d="M195,385 L195,490" stroke="#96add0" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="210" y="441" font-size="16" fill="#a9c0dd">새 매치 없음</text><path d="M350,535 L425,535" stroke="#96add0" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M735,535 L810,535" stroke="#96add0" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="40" y="640" font-size="21" fill="#eaf2ff">논리의 책임</text><text x="40" y="671" font-size="18" fill="#bfd3ed">좌표·조각 ID·효과·피해·난수·최종 상태를 결정한다.</text><text x="625" y="640" font-size="21" fill="#eaf2ff">화면의 책임</text><text x="625" y="671" font-size="18" fill="#bfd3ed">결과를 표시하고 실제 재생 완료를 알린다.</text><text x="40" y="730" font-size="18" fill="#edc77a">고정 대기·coroutine·await만으로 입력 잠금이나 단일 소유권이 생기지는 않는다.</text></g></svg>