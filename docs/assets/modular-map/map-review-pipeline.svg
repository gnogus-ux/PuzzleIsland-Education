<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">모듈러 맵 제작과 검수 단계</title><desc id="desc">배우와 카메라 블록아웃, 접합 키트, 변형 조립, 엔진 인계, 플레이와 기기 검수 순으로 진행한다. 원본 확인과 적용 제안, 미실행을 구별한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#4e6680"/></marker></defs>
<rect width="1120" height="680" fill="#f8fafc"/><g font-family="Malgun Gothic,Arial,sans-serif" fill="#17304c"><text x="40" y="52" font-size="28" font-weight="bold">작은 접합 시험에서 실제 플레이 검수로</text><text x="40" y="88" font-size="18">자체 교육 도식 · 아래 실행 단계는 이번 학습에서 미실행</text>
<g stroke="#90a8c0" stroke-width="2"><rect x="45" y="130" width="305" height="160" rx="14" fill="#e3edf9"/><rect x="407" y="130" width="305" height="160" rx="14" fill="#e4efdf"/><rect x="770" y="130" width="305" height="160" rx="14" fill="#fff0da"/><rect x="407" y="380" width="305" height="160" rx="14" fill="#e4efdf"/><rect x="770" y="380" width="305" height="160" rx="14" fill="#e3edf9"/></g>
<g font-size="22" font-weight="bold"><text x="68" y="168">1 배우·카메라·블록아웃</text><text x="432" y="168">2 최소 키트와 접합</text><text x="794" y="168">3 변형·지형·건물</text><text x="794" y="418">4 FBX·Unity 인계</text><text x="432" y="418">5 플레이·기기 검수</text></g>
<g font-size="18"><text x="68" y="211">통로 폭 · 머리 위 여유</text><text x="68" y="244">문턱 · 목표 가독성</text><text x="432" y="211">단위 · 원점 · 스냅</text><text x="432" y="244">직선/코너 · 폐곡선 시험</text><text x="794" y="211">경계 보존 · 반복 분산</text><text x="794" y="244">층 · 지붕 · 소품 분리</text><text x="794" y="461">실제 크기 · 누락 면 · UV</text><text x="794" y="494">Prefab · 재질 · 콜라이더</text><text x="432" y="461">이동 · 문 · 복원 상태</text><text x="432" y="494">LOD · 성능 · 저장 복원</text></g>
<path d="M350 210H399M712 210H762M925 290V370M770 460H722" fill="none" stroke="#4e6680" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M407 460H198V300" fill="none" stroke="#bb6b3c" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="50" y="403" font-size="18" fill="#a54b13">문제 발견 시</text><text x="50" y="432" font-size="18" fill="#a54b13">규격/블록아웃 재검토</text>
<text x="40" y="590" font-size="20">기록: 원본에서 확인한 것 / 적용을 위한 보완 / 실제 실행 결과를 구별</text><text x="40" y="629" font-size="18">강좌 시연이나 메시 수치 통과만으로 배우 이동·모바일 성능·복원 성공을 판정하지 않는다.</text></g></svg>
